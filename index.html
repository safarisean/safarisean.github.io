<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safari Sean Creative</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      background: #fff6df;
      color: #2d2929;
      font-family: Arial, sans-serif;
    }

    main {
      padding: 40px 24px;
    }

    .mark {
      width: 90px;
      height: 90px;
      margin: auto;
      display: grid;
      place-items: center;
      border: 8px solid #2d2929;
      border-radius: 50%;
      background: #c9dc13;
      font-size: 28px;
      font-weight: bold;
    }

    h1 {
      margin-bottom: 10px;
      font-size: clamp(38px, 8vw, 72px);
    }

    p {
      font-size: 20px;
      color: #625b57;
    }
  </style>
</head>

<body>
  <main>
    <div class="mark">SSC</div>
    <h1>Safari Sean Creative</h1>
    <p>Playful inventions for curious people.</p>
  </main>
</body>
</html>
